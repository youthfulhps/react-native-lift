# P6: long-press a message while the keyboard is open. env AUTO = off | one
# | flood (messages arriving while lifted), ROUNDS, KB = 1 (default) | 0
# (keyboard closed: the input is never focused), RESTORE = 1 (default) | 0
# (diagnosis: the screen skips its focus restore; each round refocuses the
# input itself). The screen drops by itself 4.5s after the lift and, after
# the drop window, gives focus back to the input.
appId: lift.example
env:
  KB: ${KB || "1"}
  RESTORE: ${RESTORE || "1"}
---
- runFlow:
    when:
      true: ${LAUNCH == "1"}
    file: _launch.yaml
- tapOn:
    id: tab-chat
- runFlow:
    when:
      true: ${AUTO != "off"}
    commands:
      - tapOn:
          id: auto-toggle
- runFlow:
    when:
      true: ${AUTO == "flood"}
    commands:
      - tapOn:
          id: auto-toggle
- assertVisible: "auto:${AUTO}"
- runFlow:
    when:
      true: ${RESTORE == "0"}
    commands:
      - tapOn:
          id: restore-toggle
      - assertVisible: "restore:off"
# The input is pre-filled with "hello" (Maestro's iOS inputText hangs).
- runFlow:
    when:
      true: ${KB == "1"}
    commands:
      - tapOn:
          id: chat-input
- repeat:
    times: ${ROUNDS}
    commands:
      - runFlow:
          when:
            true: ${KB == "1" && RESTORE == "0"}
          commands:
            - tapOn:
                id: chat-input
      - assertVisible:
          id: chat-lifted
          text: "lifted:0"
      - assertVisible:
          id: chat-focus
          text: '${KB == "1" ? "focus:yes" : "focus:no"}'
      # The keyboard (and the layout above it) must be done moving, or the
      # press lands where the target used to be. (Capped: a blinking cursor
      # never stops animating.)
      - waitForAnimationToEnd:
          timeout: 1500
      - longPressOn:
          id: lift-target
      # RESTORE=0: focus:no holds from the lift on, so wait for the lift
      # itself before waiting for the drop.
      - runFlow:
          when:
            true: ${RESTORE == "0"}
          commands:
            - extendedWaitUntil:
                visible:
                  id: chat-lifted
                  text: "lifted:1"
                timeout: 5000
      # Lifted, dropped by the screen 4.5s later, focus restored.
      - extendedWaitUntil:
          visible:
            id: chat-focus
            text: '${KB == "1" && RESTORE == "1" ? "focus:yes" : "focus:no"}'
          timeout: 10000
      - extendedWaitUntil:
          visible:
            id: chat-lifted
            text: "lifted:0"
          timeout: 10000
      - assertVisible:
          id: chat-input
          text: "hello"
# Every round lifted (a transient lifted:1 is racy to catch).
- assertVisible:
    id: chat-lifts
    text: "lifts:${ROUNDS}"
