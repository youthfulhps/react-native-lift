name: Release
on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Opens or updates the release PR from conventional commits; merging that PR
  # tags vX.Y.Z and creates the GitHub Release. A PAT (not GITHUB_TOKEN) so CI
  # runs on the release PR and its required checks can pass.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC), no npm token
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      # Staged: the version goes public only after a maintainer approves it on
      # npmjs.com with 2FA. `prepare` builds lib/ with bob; Trusted Publishing
      # adds provenance.
      - name: Stage on npm
        run: npm stage publish --access public
