version: 2
updates:
  - package-ecosystem: github-actions
    # The composite setup action is not under .github/workflows.
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
    cooldown:
      default-days: 3

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Let a release settle before it is proposed.
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
